# RFI Manager configuration. Copy to config.toml (git-ignored) and edit.
#
# SECRETS ARE NEVER READ FROM THIS FILE. Set them in the environment:
#   export ISTARI_TOKEN=...        # Istari platform token
#   export RFI_LLM_API_KEY=...     # LLM provider API key

[istari]
base_url = "https://your-instance.istaridigital.com"
request_timeout_s = 60.0
job_poll_interval_s = 3.0
job_timeout_s = 900.0
retries = 2

[llm]
provider = "anthropic"          # "anthropic" | "openai_compatible"
model = "claude-opus-5"
# endpoint = "https://enclave-gateway.example/v1/chat/completions"  # openai_compatible only
request_timeout_s = 300.0
retries = 2
max_tokens = 8192
