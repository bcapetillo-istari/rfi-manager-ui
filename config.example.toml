# RFI Manager configuration. Copy to config.toml (git-ignored) and edit.
#
# The only client-side secret is the Istari platform token:
#   export ISTARI_TOKEN=...
#
# There is NO LLM API key here (or anywhere client-side): LLM calls run as
# Istari Agent jobs, and LLM credentials are Istari Linked Accounts selected
# in the app's credential picker.

[istari]
base_url = "https://your-instance.istaridigital.com"
request_timeout_s = 60.0
job_poll_interval_s = 3.0
job_timeout_s = 900.0
retries = 2

[llm]
# Optional defaults forwarded as LLM-job parameters; leave unset to use the
# @istari_utils:rfi_manager module's defaults.
# provider = "claude"
# model = "claude-opus-5"
