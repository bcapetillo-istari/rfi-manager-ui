# RFI Manager configuration. OPTIONAL — copy to config.toml (git-ignored)
# to preset defaults. Connection happens in the app's connection bar
# (Registry URL + PAT text boxes); values here only prefill it.
#
# The ISTARI_TOKEN env var, when set, prefills the PAT box (never required).
# There is NO LLM API key here (or anywhere client-side): LLM calls run as
# Istari Agent jobs, and LLM credentials are Istari Linked Accounts selected
# in the app's credential picker.

[istari]
# prefill for the connection bar's Registry URL box
base_url = "https://your-instance.istaridigital.com"
request_timeout_s = 60.0
job_poll_interval_s = 3.0
job_timeout_s = 900.0
retries = 2
# responses processed in flight at once (rolling window across the
# platform's agents); 1 = sequential. The RESPONSE_EXTRACTION_BATCH_SIZE
# env var, when set, overrides this value.
response_concurrency = 20

[llm]
# Optional defaults forwarded as LLM-job parameters; leave unset to use the
# @istari_utils:rfi_manager module's defaults.
# provider = "claude"
# model = "claude-opus-5"
