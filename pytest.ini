[pytest]
# The default run is the offline unit suite ONLY (CLAUDE.md: tests never hit
# the network). Evals (docs/EVAL_FRAMEWORK_PRD.md) are true-integration runs
# invoked explicitly:  pytest eval  |  pytest eval --extraction custom
testpaths = tests
# eval stage modules are named after their stage (text_extraction.py), not
# test_*-prefixed — list each stage module here so pytest collects it
python_files = test_*.py text_extraction.py
markers =
    live: eval that hits the real Istari platform (needs ISTARI_BASE_URL/ISTARI_TOKEN in .env)
